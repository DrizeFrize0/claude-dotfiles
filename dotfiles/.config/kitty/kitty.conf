# Lennox terminal, after the ML4W kitty config.

font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_shape                beam
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
cursor_trail                3
scrollback_lines            5000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
dynamic_background_opacity  yes
confirm_os_window_close     0
copy_on_select              no
url_style                   curly
tab_bar_style               powerline

# Colors from the wallpaper (matugen) and your opacity setting (Lennox Settings)
include colors-matugen.conf
include lennox-settings.conf

# Your own tweaks: this file is never overwritten by Lennox
include custom.conf
