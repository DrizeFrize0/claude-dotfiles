# Lock screen: Expressive (Lennox 2.2, after end-4's illogical-impulse).
#
# Your blurred wallpaper, a big clock and the date, then a glass card with your
# picture, a greeting and a pill-shaped password field. Everything fades in on
# Material 3's "emphasized" curve; a wrong password turns the field red.
# Your picture is ~/.face (Lennox Settings > Profile). Music, alarms and the
# rest sit at the bottom (Lennox Settings > Widgets > Lock screen).

$lennox_wallpaper = $HOME/.cache/lennox/wallpaper
source = ~/.config/hypr/colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    animation = fadeIn, 1, 5, md3_decel
    animation = fadeOut, 1, 4, md3_accel
    animation = inputFieldDots, 1, 2, md3_decel
    animation = inputFieldColors, 1, 3, md3_decel
}

background {
    monitor =
    path = $lennox_wallpaper/blurred.png
    color = $surface
}

# ---------------------------------------------------------------- clock and date

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='800'>$(date +%H:%M)</span>"
    color = $on_surface
    font_size = 112
    font_family = Inter
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $primary
    font_size = 20
    font_family = Inter
    position = 0, 205
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# ---------------------------------------------------------------- the card

shape {
    monitor =
    size = 440, 330
    color = rgba(10, 10, 16, 0.38)
    rounding = 36
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, -95
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.face
    size = 112
    rounding = -1
    border_size = 3
    border_color = $primary
    reload_time = -1
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:60000] $HOME/.local/bin/lennox-profile greeting
    color = $on_surface
    font_size = 22
    font_family = Inter
    position = 0, -105
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $outline
    inner_color = $surface_container
    font_color = $on_surface
    font_family = Inter
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    rounding = -1
    check_color = $primary
    fail_color = $error
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    capslock_color = $tertiary
    position = 0, -185
    halign = center
    valign = center
}

# ---------------------------------------------------------------- bottom: music, alarm, weather...

label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/lennox-lockinfo all
    color = $on_surface
    font_size = 14
    font_family = Inter
    text_align = center
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
}

# Battery, top right
label {
    monitor =
    text = cmd[update:30000] $HOME/.local/bin/lennox-lockinfo battery
    color = $on_surface
    font_size = 14
    font_family = Inter
    position = -36, -28
    halign = right
    valign = top
}
