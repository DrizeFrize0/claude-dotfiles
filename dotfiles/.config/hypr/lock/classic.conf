# Lock screen: Classic (the ML4W one). Lennox Settings > Widgets > Lock screen picks the style.

$lennox_wallpaper = $HOME/.cache/lennox/wallpaper

# Wallpaper colors (written by matugen)
source = ~/.config/hypr/colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = $lennox_wallpaper/blurred.png
    color = $surface
}

input-field {
    monitor =
    size = 200, 50
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    inner_color = $primary
    font_color = $on_primary
    font_family = Fira Sans Semibold
    outer_color = $on_primary
    outline_thickness = 3
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 10
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $primary
    font_size = 70
    font_family = Fira Sans Semibold
    position = -50, 20
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# User name
label {
    monitor =
    text = $USER
    color = $primary
    font_size = 20
    font_family = Fira Sans Semibold
    position = -50, 120
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Lock screen widgets: music, next alarm, weather, phone, server (one per line;
# Lennox Settings > Widgets > Lock screen). Media keys work while locked.
label {
    monitor =
    text = cmd[update:3000] $HOME/.local/bin/lennox-lockinfo all
    color = $on_surface
    font_size = 15
    font_family = Fira Sans Semibold
    text_align = left
    position = 50, 40
    halign = left
    valign = bottom
    shadow_passes = 3
    shadow_size = 6
}

# Date above the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $primary
    font_size = 18
    font_family = Fira Sans Semibold
    position = -50, 165
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Wallpaper tile
image {
    monitor =
    path = $lennox_wallpaper/square.png
    size = 280
    rounding = 40
    border_size = 4
    border_color = $primary $on_primary 90deg
    rotate = 0
    reload_time = -1
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}
