# Lennox login screen. Current=lennox-expressive is the Lennox 2.2 screen (your picture,
# profiles, Material You colors from your wallpaper); Current=lennox is the classic ML4W one.
[Theme]
Current=lennox-expressive

[General]
InputMethod=qtvirtualkeyboard
# QML_XHR_ALLOW_FILE_READ lets the theme read its colors file (backgrounds/colors.json)
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/lennox/components/,QT_IM_MODULE=qtvirtualkeyboard,QML_XHR_ALLOW_FILE_READ=1
