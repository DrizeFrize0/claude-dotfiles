# Lennox: memory tuned for zram (compressed swap in RAM, see /etc/systemd/zram-generator.conf).
# Swapping to zram is cheap, so let the kernel use it early and keep real RAM for apps and the
# file cache; read one page at a time from it (no read-ahead, which only helps real disks).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Keep folder and file names cached a little longer: faster file pickers and searches
vm.vfs_cache_pressure = 50
