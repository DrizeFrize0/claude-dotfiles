# Lennox: lower, steadier ping for games and calls.
# BBR keeps the connection's queues short (less lag when something downloads),
# fq paces the packets, and the rest avoids slow starts after a quiet moment.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
